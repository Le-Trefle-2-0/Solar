name: Vérification du build (PR vers stable)

on:
  pull_request:
    branches:
      - stable
  workflow_dispatch:

concurrency:
  group: pr-build-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build du monorepo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Cache Next.js
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/web/**/*.ts', 'apps/web/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Install + test de build
        run: node scripts/test-build.mjs --install --clean

      - name: Logs de build
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: .build-logs/
          retention-days: 7
