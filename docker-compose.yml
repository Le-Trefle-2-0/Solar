# LOCAL DEVELOPMENT ONLY (npm run compose:up). Never deploy with this file: it runs the
# development servers with the repository mounted (#245).
# - every published port is bound to 127.0.0.1 (not reachable from the network);
# - MYSQL_ROOT_PASSWORD and REDIS_PASSWORD come from the untracked root .env and are required.
version: '3.9'

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: solar
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -p\"$$MYSQL_ROOT_PASSWORD\"" ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Password required; only reachable by the other containers
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}" ]
    expose:
      - "6379"

  api:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev:api"
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3001
      NEXT_PUBLIC_APP_URL: http://web:3000
      INTERNAL_AUTH_URL: http://web:3000
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/solar
      VOICE_INTERNAL_URL: http://voice:3003
      WS_INTERNAL_URL: http://ws:3002
    volumes:
      - ./:/app
    depends_on:
      mysql:
        condition: service_healthy

  ws:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev:ws"
    ports:
      - "127.0.0.1:3002:3002"
    environment:
      WS_HOST: 0.0.0.0
      WS_PORT: 3002
      NEXT_PUBLIC_APP_URL: http://web:3000
      INTERNAL_AUTH_URL: http://web:3000
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      API_BASE_URL: http://api:3001
    volumes:
      - ./:/app
    depends_on:
      - redis
      - api

  voice:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev:voice"
    ports:
      - "127.0.0.1:3003:3003"
      # Mediasoup UDP/TCP ports (adjust as needed)
      - "127.0.0.1:40000-40050:40000-40050/udp"
      - "127.0.0.1:40000-40050:40000-40050/tcp"
    environment:
      VOICE_HOST: 0.0.0.0
      VOICE_PORT: 3003
      NEXT_PUBLIC_APP_URL: http://web:3000
      INTERNAL_AUTH_URL: http://web:3000
      API_BASE_URL: http://api:3001
      WS_INTERNAL_URL: http://ws:3002
      MEDIASOUP_MIN_PORT: 40000
      MEDIASOUP_MAX_PORT: 40050
      MEDIASOUP_ANNOUNCED_IP: 127.0.0.1
    volumes:
      - ./:/app
    depends_on:
      - api

  storage:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev:storage"
    # Internal only: the browser goes through the web app's /api/files (STORAGE_SECRET comes from .env)
    expose:
      - "3004"
    environment:
      STORAGE_HOST: 0.0.0.0
      STORAGE_PORT: 3004
    volumes:
      - ./:/app
      - storage_data:/app/apps/storage/uploads
    depends_on:
      - api

  # Discord bot: idle without DISCORD_TOKEN (and the bot settings) in the .env
  bot:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev:bot"
    environment:
      API_BASE_URL: http://api:3001
      WS_INTERNAL_URL: http://ws:3002
    volumes:
      - ./:/app
    depends_on:
      - api
      - ws

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev:web"
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: 3000
      NEXT_PUBLIC_APP_URL: http://web:3000
      NEXT_PUBLIC_API_URL: http://api:3001
      STORAGE_INTERNAL_URL: http://storage:3004
      NEXT_PUBLIC_WS_URL: ws://localhost:3002
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/solar
    volumes:
      - ./:/app
    depends_on:
      mysql:
        condition: service_healthy
      api:
        condition: service_started
      ws:
        condition: service_started
      storage:
        condition: service_started

volumes:
  db_data:
  storage_data:
